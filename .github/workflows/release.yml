name: Release

# Push a tag `vX.Y.Z` (must match `version` in Cargo.toml) to publish:
#   - GitHub release with ruwa-gateway-<tag>-<arch>-linux-musl.tar.gz + SHA256SUMS
#   - multi-arch (amd64, arm64) image ghcr.io/<owner>/<repo>
# Run it by hand (workflow_dispatch) to rehearse the build without publishing.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$crate" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$crate" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi

  binaries:
    name: build ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked --features bundled --target ${{ matrix.target }}
      - name: Package
        run: |
          name="ruwa-gateway-v${{ needs.version.outputs.version }}-${{ matrix.arch }}-linux-musl"
          mkdir -p "dist/$name" "out/${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/ruwa-gateway" "dist/$name/"
          cp README.md "dist/$name/"
          [ ! -f LICENSE ] || cp LICENSE "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          cp "target/${{ matrix.target }}/release/ruwa-gateway" "out/${{ matrix.arch }}/"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            ruwa-gateway-*.tar.gz
            ruwa-gateway-*.tar.gz.sha256
            out/${{ matrix.arch }}/ruwa-gateway

  docker:
    name: docker image
    needs: [version, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Lay out binaries for the Dockerfile
        run: |
          mkdir -p dist
          cp -r out/amd64 out/arm64 dist/
          chmod +x dist/*/ruwa-gateway
      - uses: docker/setup-qemu-action@v3
        # Only needed to run the final `apk add` layer for arm64; nothing is compiled under emulation.
      - uses: docker/setup-buildx-action@v3
      # `latest` only for stable tags; pre-releases (vX.Y.Z-rc.N) keep their own tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ github.ref_type != 'tag' }}
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: github release
    if: github.ref_type == 'tag'
    needs: [binaries, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
      - name: Checksums
        run: cat ruwa-gateway-*.tar.gz.sha256 > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --generate-notes $prerelease \
            ruwa-gateway-*.tar.gz SHA256SUMS
