[package]
name = "ruwa-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "GOWA-compatible WhatsApp REST API built on whatsapp-rust"
publish = false

[dependencies]
# WhatsApp protocol. Pinned to a git rev: the 0.7.0 crates.io release enables
# `simd`, which needs nightly. Only `src/wa/` may import this crate directly.
# Bump procedure: see docs/PLAN.md "Konvensi kerja".
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "94877bedb6cd473864f9f6b332a5c13d5fbef789", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "process", "fs"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
percent-encoding = "2"
serde_html_form = "0.2"
mime_guess = "2"
infer = "0.19"
tempfile = "3"
diesel = { version = "2.4", default-features = false, features = ["sqlite"] }
diesel_migrations = { version = "2.4", default-features = false, features = ["sqlite"] }
chrono-tz = "0.10.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
futures-util = "0.3"
